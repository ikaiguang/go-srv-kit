syntax = "proto3";

package kit.jaegerpkg;

option go_package           = "github.com/ikaiguang/go-srv-kit/data/jaeger/jaeger;jaegerpkg";
option java_multiple_files  = true;
option java_package         = "kit.jaegerpkg";
option java_outer_classname = "KitJaegerPkg";

import "google/protobuf/duration.proto";

// Config jaeger config
message Config {
  bool enable                      = 100;
  string kind                      = 1;  // value: grpc、http
  string addr                      = 2;
  bool is_insecure                 = 3;
  google.protobuf.Duration timeout = 4;  // (s)
  bool with_http_basic_auth        = 5;
  string username                  = 6;
  string password                  = 7;
}
